# One of: added, changed, deprecated, removed, fixed, security
# (matches a Keep a Changelog https://keepachangelog.com/en/1.1.0/ section)
change_type: changed

# A short, user-facing description of the change, as it should read in CHANGELOG.md.
note: >-
  Derive the automatic `service.name` fallback from the application's own identity
  — the app module in `config/application.rb`/`config/app.rb` (Rails, Hanami), or
  the `run` target/app class in `config.ru` (modular Sinatra, Roda, Rack,
  single-file Rails) — instead of the program's entry point. Launcher wrappers
  (`bundle`, `puma`, `rackup`, …) are no longer reported as the service name; when
  no application name can be derived, the SDK's `unknown_service` default stands.

# The GitHub issue and/or pull request number(s) this change relates to, e.g. [8].
issues: [23]
