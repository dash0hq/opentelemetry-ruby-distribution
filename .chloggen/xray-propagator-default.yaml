# One of: added, changed, deprecated, removed, fixed, security
# (matches a Keep a Changelog https://keepachangelog.com/en/1.1.0/ section)
change_type: changed

# A short, user-facing description of the change, as it should read in CHANGELOG.md.
note: >-
  **Breaking:** the default propagators change from `tracecontext,baggage` to
  `tracecontext,baggage,xray`, bundling `opentelemetry-propagator-xray` so traces stay
  connected through AWS load balancers. The X-Ray context wins over `traceparent` when
  both are present. Set `OTEL_PROPAGATORS=tracecontext,baggage` to restore the previous behavior.

