# One of: added, changed, deprecated, removed, fixed, security
# (matches a Keep a Changelog https://keepachangelog.com/en/1.1.0/ section)
change_type: fixed

# A short, user-facing description of the change, as it should read in CHANGELOG.md.
note: >-
  Install instrumentation for libraries that load in stages, most visibly
  `ActiveSupport` and `ActionView` in a Rails application. The `TracePoint(:end)`
  sweep can run while a library is still being required, when its top-level
  constant exists but its version constant does not yet; upstream's compatibility
  check reads that version and raised, and the instrumentation was then treated as
  permanently unusable, so those spans were missing and every boot logged two
  errors. Such an instrumentation is now retried on a later sweep.

# The GitHub issue and/or pull request number(s) this change relates to, e.g. [8].
issues: [22]
