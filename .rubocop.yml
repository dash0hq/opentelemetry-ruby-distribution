plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - "test/apps/**/*"
    - "vendor/**/*"

Metrics/ModuleLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Layout/LineLength:
  Max: 120
Metrics/BlockLength:
  Exclude:
    - "**/*_test.rb"
    - "*.gemspec"
Naming/FileName:
  Enabled: false
# Several tests assert on multiple facets of one behavior in a single, cohesive
# case; splitting them purely to satisfy a count would hurt readability.
Minitest/MultipleAssertions:
  Max: 12
