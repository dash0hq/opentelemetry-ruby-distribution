version: 2
updates:
  # Root Gemfile: dev/test tooling only. None of it ships, so PRs from this
  # manifest need no changelog fragment (see .chloggen/README.md).
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "opentelemetry-*"
      # minitest 6+ conflicts with the Rails 7.2 test stack (activesupport
      # requires minitest < 6); hold it on 5.x.
      - dependency-name: "minitest"
        versions: [">= 6"]

  # Packaging closure: the gems installed into the bundle the injector mounts.
  # This manifest owns OpenTelemetry bumps — it updates the gemspec constraints
  # and the committed Gemfile.lock together. `increase` prefers bumping the
  # requirement to the tested version over widening the range. What this manifest
  # changes does ship, so its PRs do need a changelog fragment pushed onto the
  # dependabot branch (see .chloggen/README.md).
  - package-ecosystem: "bundler"
    directory: "/packaging"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
