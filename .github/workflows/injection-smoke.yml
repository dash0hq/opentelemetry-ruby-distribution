# Runs the Dockerized injection smoke test (test/docker) on glibc and musl. Kept
# separate from the main CI so its Docker/network cost doesn't block the fast
# unit/integration suite. On GitHub's x86_64 runners this also provides amd64
# coverage, complementing local arm64 runs.

name: Injection smoke

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/docker/**'
      - 'dash0-opentelemetry.gemspec'
      - '.github/workflows/injection-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/docker/**'
      - 'dash0-opentelemetry.gemspec'
      - '.github/workflows/injection-smoke.yml'

jobs:
  injection-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Injection smoke (glibc + musl)
        run: test/docker/verify.sh
