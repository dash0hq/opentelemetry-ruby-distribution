name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write # create the GitHub release / push attestations
      id-token: write # RubyGems trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        # Refuse to publish a tag that does not point at a commit reachable from
        # origin/main. Without this guard, anyone with tag-push permission could
        # publish an arbitrary (unreviewed, fork, or stale) commit to RubyGems.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/main; refusing to publish."
            exit 1
          fi
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Verify (tests + lint)
        run: bundle exec rake
      - name: Injection smoke (glibc + musl)
        run: packaging/verify.sh
      - name: Build and publish to RubyGems
        uses: rubygems/release-gem@v1
      - name: Create GitHub release
        # The Dash0 operator's weekly update workflow discovers new versions via
        # `gh release list`, which only sees published GitHub releases, not bare
        # tags. Extract this version's CHANGELOG.md section as the release notes
        # and attach the built .gem (from the rubygems/release-gem step above)
        # for offline installs and artifact verification.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [$version]" '
            index($0, header) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for $GITHUB_REF_NAME (looked for '## [$version]')."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            pkg/*.gem

  sync-docs:
    needs: release
    uses: ./.github/workflows/sync-docs.yml
    secrets: inherit
    with:
      dry-run: false
