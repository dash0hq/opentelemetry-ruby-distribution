name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
    name: verify (ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run verification (tests + lint)
        run: bundle exec rake

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: changelog
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Validate changelog fragments
        run: bundle exec rake chloggen:validate
      - name: Require a changelog fragment for changes under lib/
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-changelog')"
        run: |
          git fetch --depth=100 origin "$GITHUB_BASE_REF"
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")

          if ! grep -q '^lib/' <<< "$changed"; then
            echo 'No changes under lib/, skipping changelog fragment check.'
            exit 0
          fi

          fragments=$(grep '^\.chloggen/' <<< "$changed" | grep -v '^\.chloggen/TEMPLATE\.yaml$' || true)
          if [ -z "$fragments" ]; then
            echo "::error::This PR changes lib/ but adds no .chloggen/*.yaml fragment. Add one with" \
              "'bundle exec rake chloggen:new[slug]', or apply the 'skip-changelog' label."
            exit 1
          fi

          echo 'Found changelog fragment(s):'
          echo "$fragments"
