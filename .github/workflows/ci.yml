name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
    name: verify (ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run verification (tests + lint)
        run: bundle exec rake

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: changelog
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Determine changed files
        run: |
          git fetch --depth=100 origin "$GITHUB_BASE_REF"
          git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" > /tmp/changed-files.txt
      - name: Determine whether this is a dependabot PR that doesn't touch shipped dependencies
        id: dependabot-check
        run: |
          skip=false
          if [ "$GITHUB_ACTOR" = "dependabot[bot]" ] && ! grep -qx 'dash0-opentelemetry.gemspec' /tmp/changed-files.txt; then
            echo 'Dependabot PR that only touches dev/test dependencies, skipping changelog checks.'
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - name: Validate changelog fragments
        if: steps.dependabot-check.outputs.skip != 'true'
        run: bundle exec rake chloggen:validate
      - name: Forbid manual edits to CHANGELOG.md
        if: steps.dependabot-check.outputs.skip != 'true'
        run: |
          if grep -qx 'CHANGELOG.md' /tmp/changed-files.txt; then
            echo "::error::CHANGELOG.md must not be edited directly in a pull request. Add a" \
              ".chloggen/*.yaml fragment instead ('bundle exec rake chloggen:new[slug]') -" \
              "CHANGELOG.md is only updated by 'rake chloggen:update' at release time."
            exit 1
          fi
      - name: Require a changelog fragment for changes under lib/
        if: steps.dependabot-check.outputs.skip != 'true' && !contains(github.event.pull_request.labels.*.name, 'Skip changelog')
        run: |
          if ! grep -q '^lib/' /tmp/changed-files.txt; then
            echo 'No changes under lib/, skipping changelog fragment check.'
            exit 0
          fi

          fragments=$(grep '^\.chloggen/' /tmp/changed-files.txt | grep -v '^\.chloggen/TEMPLATE\.yaml$' || true)
          if [ -z "$fragments" ]; then
            echo "::error::This PR changes lib/ but adds no .chloggen/*.yaml fragment. Add one with" \
              "'bundle exec rake chloggen:new[slug]', or apply the 'Skip changelog' label."
            exit 1
          fi

          echo 'Found changelog fragment(s):'
          echo "$fragments"
