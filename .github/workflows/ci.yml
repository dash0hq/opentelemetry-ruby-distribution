name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
    name: verify (ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run verification (tests + lint)
        run: bundle exec rake

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: changelog
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Determine changed files
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" > /tmp/changed-files.txt
      - name: Validate changelog fragments
        run: bundle exec rake chloggen:validate
      - name: Forbid manual edits to CHANGELOG.md
        run: |
          if grep -qx 'CHANGELOG.md' /tmp/changed-files.txt; then
            echo "::error::CHANGELOG.md must not be edited directly in a pull request. Add a" \
              ".chloggen/*.yaml fragment instead ('bundle exec rake chloggen:new[slug]') -" \
              "CHANGELOG.md is only updated by 'rake chloggen:update' at release time."
            exit 1
          fi
      # Only changes that reach users need a fragment: lib/, the gemspec's
      # constraints on the OpenTelemetry gems we ship, and packaging/Gemfile.lock
      # (the shipped closure, transitive dependencies included). Dependency
      # updates we do not ship - dependabot's test and infra bumps against the
      # root Gemfile - therefore pass without one. See Chloggen::SHIPPED_PATHS.
      - name: Require a changelog fragment for user-facing changes
        if: "!contains(github.event.pull_request.labels.*.name, 'Skip changelog')"
        run: bundle exec rake "chloggen:required[/tmp/changed-files.txt]"
